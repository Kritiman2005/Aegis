name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject OAuth Credentials into build
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          FIGMA_CLIENT_ID: ${{ secrets.FIGMA_CLIENT_ID }}
          FIGMA_CLIENT_SECRET: ${{ secrets.FIGMA_CLIENT_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          AIRTABLE_CLIENT_ID: ${{ secrets.AIRTABLE_CLIENT_ID }}
          AIRTABLE_CLIENT_SECRET: ${{ secrets.AIRTABLE_CLIENT_SECRET }}
          ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
          ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
        run: |
          # Write credentials.py with all secrets baked in before PyInstaller bundles the code
          $content = @"
          # AUTO-GENERATED BY CI — DO NOT EDIT OR COMMIT
          GOOGLE_CLIENT_ID = '$env:GOOGLE_CLIENT_ID'
          GOOGLE_CLIENT_SECRET = '$env:GOOGLE_CLIENT_SECRET'
          SLACK_CLIENT_ID = '$env:SLACK_CLIENT_ID'
          SLACK_CLIENT_SECRET = '$env:SLACK_CLIENT_SECRET'
          NOTION_CLIENT_ID = '$env:NOTION_CLIENT_ID'
          NOTION_CLIENT_SECRET = '$env:NOTION_CLIENT_SECRET'
          FIGMA_CLIENT_ID = '$env:FIGMA_CLIENT_ID'
          FIGMA_CLIENT_SECRET = '$env:FIGMA_CLIENT_SECRET'
          GITHUB_CLIENT_ID = '$env:GITHUB_OAUTH_CLIENT_ID'
          GITHUB_CLIENT_SECRET = '$env:GITHUB_OAUTH_CLIENT_SECRET'
          HUBSPOT_CLIENT_ID = '$env:HUBSPOT_CLIENT_ID'
          HUBSPOT_CLIENT_SECRET = '$env:HUBSPOT_CLIENT_SECRET'
          LINEAR_CLIENT_ID = '$env:LINEAR_CLIENT_ID'
          LINEAR_CLIENT_SECRET = '$env:LINEAR_CLIENT_SECRET'
          AIRTABLE_CLIENT_ID = '$env:AIRTABLE_CLIENT_ID'
          AIRTABLE_CLIENT_SECRET = '$env:AIRTABLE_CLIENT_SECRET'
          ATLASSIAN_CLIENT_ID = '$env:ATLASSIAN_CLIENT_ID'
          ATLASSIAN_CLIENT_SECRET = '$env:ATLASSIAN_CLIENT_SECRET'
          SALESFORCE_CLIENT_ID = '$env:SALESFORCE_CLIENT_ID'
          SALESFORCE_CLIENT_SECRET = '$env:SALESFORCE_CLIENT_SECRET'
          "@
          $content | Set-Content "backend\app\config\credentials.py" -Encoding utf8
          Write-Output "credentials.py written successfully"

      - name: Build Python Sidecar (.exe)
        run: npm run build:python

      - name: Smoke Test Python Binary
        shell: pwsh
        run: |
          $env:AEGIS_DATA_DIR = "$PWD\test_data"
          New-Item -ItemType Directory -Force -Path $env:AEGIS_DATA_DIR | Out-Null

          $process = Start-Process `
            -FilePath "backend\dist\main.exe" `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput "backend_stdout.log" `
            -RedirectStandardError "backend_stderr.log"

          $maxRetries = 15
          $success = $false
          for ($i = 0; $i -lt $maxRetries; $i++) {
            if ($process.HasExited) {
              Write-Error "Backend process exited prematurely (code $($process.ExitCode))!"
              Write-Output "--- STDERR ---"
              Get-Content "backend_stderr.log" -ErrorAction SilentlyContinue
              Write-Output "--- STDOUT ---"
              Get-Content "backend_stdout.log" -ErrorAction SilentlyContinue
              exit 1
            }

            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:8000/api/health" `
                -UseBasicParsing `
                -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Output "Backend booted successfully after $($i * 2)s!"
                $success = $true
                break
              }
            } catch {
              Write-Output "Waiting for backend... attempt $i"
              Start-Sleep -Seconds 2
            }
          }

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

          if (-not $success) {
            Write-Error "Backend failed to respond to health check after 30 seconds!"
            Write-Output "--- STDERR ---"
            Get-Content "backend_stderr.log" -ErrorAction SilentlyContinue
            Write-Output "--- STDOUT ---"
            Get-Content "backend_stdout.log" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Next.js + Electron
        run: npm run build:next && npm run build:electron
        env:
          NODE_ENV: production

      - name: Package Windows .exe
        run: electron-builder --win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Windows-Exe
          path: release/*.exe
