name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      # ── Python ───────────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Visual C++ Redistributable
        shell: pwsh
        run: |
          # Required by llama-cpp-python which links against MSVC runtime DLLs
          choco install vcredist140 -y --no-progress

      - name: Install Python Dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── Inject credentials before PyInstaller bundles them ───────────────────
      - name: Inject OAuth Credentials into build
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          FIGMA_CLIENT_ID: ${{ secrets.FIGMA_CLIENT_ID }}
          FIGMA_CLIENT_SECRET: ${{ secrets.FIGMA_CLIENT_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          AIRTABLE_CLIENT_ID: ${{ secrets.AIRTABLE_CLIENT_ID }}
          AIRTABLE_CLIENT_SECRET: ${{ secrets.AIRTABLE_CLIENT_SECRET }}
          ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
          ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
        run: |
          $file = "backend\app\config\credentials.py"
          Set-Content  $file "# AUTO-GENERATED BY CI - DO NOT EDIT OR COMMIT"
          Add-Content  $file "GOOGLE_CLIENT_ID     = '$env:GOOGLE_CLIENT_ID'"
          Add-Content  $file "GOOGLE_CLIENT_SECRET = '$env:GOOGLE_CLIENT_SECRET'"
          Add-Content  $file "SLACK_CLIENT_ID      = '$env:SLACK_CLIENT_ID'"
          Add-Content  $file "SLACK_CLIENT_SECRET  = '$env:SLACK_CLIENT_SECRET'"
          Add-Content  $file "NOTION_CLIENT_ID     = '$env:NOTION_CLIENT_ID'"
          Add-Content  $file "NOTION_CLIENT_SECRET = '$env:NOTION_CLIENT_SECRET'"
          Add-Content  $file "FIGMA_CLIENT_ID      = '$env:FIGMA_CLIENT_ID'"
          Add-Content  $file "FIGMA_CLIENT_SECRET  = '$env:FIGMA_CLIENT_SECRET'"
          Add-Content  $file "GITHUB_CLIENT_ID     = '$env:GITHUB_OAUTH_CLIENT_ID'"
          Add-Content  $file "GITHUB_CLIENT_SECRET = '$env:GITHUB_OAUTH_CLIENT_SECRET'"
          Add-Content  $file "HUBSPOT_CLIENT_ID     = '$env:HUBSPOT_CLIENT_ID'"
          Add-Content  $file "HUBSPOT_CLIENT_SECRET = '$env:HUBSPOT_CLIENT_SECRET'"
          Add-Content  $file "LINEAR_CLIENT_ID     = '$env:LINEAR_CLIENT_ID'"
          Add-Content  $file "LINEAR_CLIENT_SECRET = '$env:LINEAR_CLIENT_SECRET'"
          Add-Content  $file "AIRTABLE_CLIENT_ID     = '$env:AIRTABLE_CLIENT_ID'"
          Add-Content  $file "AIRTABLE_CLIENT_SECRET = '$env:AIRTABLE_CLIENT_SECRET'"
          Add-Content  $file "ATLASSIAN_CLIENT_ID     = '$env:ATLASSIAN_CLIENT_ID'"
          Add-Content  $file "ATLASSIAN_CLIENT_SECRET = '$env:ATLASSIAN_CLIENT_SECRET'"
          Add-Content  $file "SALESFORCE_CLIENT_ID     = '$env:SALESFORCE_CLIENT_ID'"
          Add-Content  $file "SALESFORCE_CLIENT_SECRET = '$env:SALESFORCE_CLIENT_SECRET'"
          Write-Output "=== credentials.py written ==="
          Get-Content $file

      # ── Build Python sidecar — run from backend/ where main.spec lives ────────
      - name: Build Python Sidecar (.exe)
        shell: pwsh
        working-directory: backend
        run: pyinstaller main.spec

      # ── Smoke test ────────────────────────────────────────────────────────────
      - name: Smoke Test Python Binary
        shell: pwsh
        run: |
          $env:AEGIS_DATA_DIR = "$PWD\test_data"
          New-Item -ItemType Directory -Force -Path $env:AEGIS_DATA_DIR | Out-Null

          $process = Start-Process `
            -FilePath "backend\dist\main.exe" `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput "backend_stdout.log" `
            -RedirectStandardError  "backend_stderr.log"

          $maxRetries = 15
          $success = $false
          for ($i = 0; $i -lt $maxRetries; $i++) {
            if ($process.HasExited) {
              Write-Error "Backend exited prematurely (code $($process.ExitCode))"
              Get-Content "backend_stderr.log" -ErrorAction SilentlyContinue
              Get-Content "backend_stdout.log" -ErrorAction SilentlyContinue
              exit 1
            }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -ErrorAction Stop
              if ($r.StatusCode -eq 200) {
                Write-Output "Backend healthy after $($i * 2)s"
                $success = $true
                break
              }
            } catch {
              Write-Output "Waiting... attempt $i"
              Start-Sleep -Seconds 2
            }
          }

          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

          if (-not $success) {
            Write-Error "Backend did not respond in 30 seconds"
            Get-Content "backend_stderr.log" -ErrorAction SilentlyContinue
            Get-Content "backend_stdout.log" -ErrorAction SilentlyContinue
            exit 1
          }

      # ── Build frontend + electron ─────────────────────────────────────────────
      - name: Build Next.js static export
        shell: pwsh
        run: npx next build
        env:
          NODE_ENV: production

      - name: Compile Electron main process
        shell: pwsh
        run: npx tsc -p electron/tsconfig.json

      # ── Package ───────────────────────────────────────────────────────────────
      - name: Package Windows .exe
        shell: pwsh
        run: npx electron-builder --win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Windows-Exe
          path: release/*.exe
